version: '2.0'
metadata:
  name: Aegis ContractLock Billing Behavioral Contract V2
  purpose: Evidence-gated legacy modernization with measurable behavioral coverage
subject:
  legacy_factory: legacy_app.billing.monolith:create_service
  candidate_factory: modern_app.billing.api:create_service
readiness:
  statement_coverage_min: 95.0
  branch_coverage_min: 90.0
  critical_tags:
    - critical_boundary
    - validation
    - refund
    - idempotency
    - tax
outputs:
  baseline: baseline/baseline.json
  candidate_evidence: reports/candidate-evidence.json
  verification_json: reports/verification.json
  verification_md: reports/verification.md
  coverage_json: reports/contract-coverage.json
  coverage_md: reports/contract-coverage.md
  gauntlet_json: reports/gauntlet-report.json
  gauntlet_md: reports/gauntlet-report.md
  architecture_json: reports/architecture-comparison.json
  architecture_md: reports/architecture-comparison.md
  certificate_json: reports/evidence-certificate.json
  certificate_md: reports/evidence-certificate.md
  dashboard_html: reports/dashboard.html
  readiness_json: reports/readiness.json
  readiness_md: reports/readiness.md

cases:

  # ─────────────────────────────────────────────────────────────────
  # RETAIL TIER — baseline, no discount
  # ─────────────────────────────────────────────────────────────────

  - id: retail_basic_usca_goods
    description: RETAIL customer, US_CA, single GOODS item below shipping threshold — 0% discount, 7.25% tax, $12 shipping
    tags:
      - tier_retail
      - tax
      - shipping
    steps:
      - id: invoice
        operation: create_invoice
        input:
          operation_id: op-retail-basic
          customer:
            id: C-RETAIL-01
            tier: RETAIL
            region: US_CA
            status: ACTIVE
          items:
            - sku: SKU-001
              category: GOODS
              qty: 1
              unit_price: '100.00'
          payment_method: CARD
    invariants:
      - id: retail_basic-noexc
        type: no_exception
        step: invoice
      - id: retail_basic-eq
        type: invoice_total_equation
        step: invoice
      - id: retail_basic-discount_rate
        type: field_equals
        step: invoice
        path: result.discount_rate
        value: '0.0000'
      - id: retail_basic-grand_total
        type: field_equals
        step: invoice
        path: result.grand_total
        value: '119.25'
      - id: retail_basic-shipping
        type: field_equals
        step: invoice
        path: result.shipping
        value: '12.00'
      - id: retail_basic-tax
        type: field_equals
        step: invoice
        path: result.tax
        value: '7.25'
      - id: retail_basic-status
        type: field_equals
        step: invoice
        path: result.status
        value: OPEN
      - id: retail_basic-ledger
        type: state_table_delta
        step: invoice
        table: ledger
        delta: 1
      - id: retail_basic-audit_event
        type: event_present
        step: invoice
        event: INVOICE_CREATED

